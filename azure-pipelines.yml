trigger:
  - main

pool:
  name: sandeep-pool

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'init'
      backendServiceArm: 'ado-svc'
      backendAzureRmStorageAccountName: 'yogistg98227'
      backendAzureRmContainerName: 'yogi-ctr'
      backendAzureRmKey: 'yogi.tfstate'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'plan'
      environmentServiceNameAzureRM: 'ado-svc'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'apply'
      commandOptions: '-auto-approve'
      environmentServiceNameAzureRM: 'ado-svc'