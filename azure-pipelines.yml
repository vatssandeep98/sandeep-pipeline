trigger:
  - main

pool:
  name: sandeep-pool

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'ado-svc'
    backendAzureRmStorageAccountName: 'sandeepstg00234'
    backendAzureRmContainerName: 'sandeep-ctr'
    backendAzureRmKey: 'pipeline.tfstate'

  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'plan'
  - task: TerraformTask@5
    inputs:
      provider: 'azurerm'
      command: 'apply'
      commandOptions: '-auto-approve'